---

version: 2.1

executors:
  ruby:
    resource_class: small
    docker:
      - image: cimg/ruby:3.3.6
        environment:
          BUNDLE_VERSION: "2.7.2"

# yaml anchor filters
master_only: &master_only
  filters:
    branches:
      only: master
    tags:
      ignore: /.*/
pr_only: &pr_only
  filters:
    branches:
      ignore: master
    tags:
      ignore: /.*/
version_tags_only: &version_tags_only
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^v.*/

jobs:
  build:
    executor: ruby
    steps:
      # This project's CircleCI checkout key no longer authenticates with
      # GitHub (every built-in `checkout` step fails with
      # "git@github.com: Permission denied (publickey)"), so clone the public
      # repo over HTTPS instead. CIRCLE_SHA1 is set for branch, PR, and tag
      # builds alike, which keeps the final-release (v* tag) workflow working.
      # If the checkout key is ever repaired in CircleCI project settings,
      # this step can go back to the plain `checkout` step.
      - run:
          name: Checkout over HTTPS
          command: |
            git clone "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .
            git checkout --quiet "${CIRCLE_SHA1}"
            git log -1 --oneline
      - run:
          name: Install Bundler specific version
          command: |
            gem install bundler --version "${BUNDLE_VERSION}" --force
            bundle config set --local path 'vendor/bundle'
            bundle config set --local frozen 'true'
            bundle config set --local jobs '4'
            bundle config set --local retry '3'
      - run:
          name: Install Ruby Dependencies
          command: bundle install --jobs=4 --retry=3
      - run:
          name: Run Tests
          command: bundle exec rake ci:specs
      - store_test_results:
          name: Store test results
          path: tmp/test-results
      - run:
          name: Run StandardRB
          command: bundle exec standardrb
      - run:
          name: Build documentation
          command: bundle exec rake ci:doc
      - store_artifacts:
          name: Saves documentation
          path: doc

workflows:
  version: 2

  pull-requests:
    jobs:
      - build:
          <<: *pr_only

  trunk:
    jobs:
      - build:
          <<: *master_only

  final-release:
    jobs:
      - build:
          <<: *version_tags_only
